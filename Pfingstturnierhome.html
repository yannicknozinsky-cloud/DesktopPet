<!DOCTYPE html>
<html lang="de">
<head>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<meta charset="UTF-8">
<title>Pfingstturnier 2026 - HOME</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
    /* Modal Styling */
.modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); overflow-y: auto; }
.modal-content { background-color: white; margin: 10% auto; padding: 20px; border-radius: 8px; width: 80%; max-width: 500px; text-align: center; }
.admin-btn { background-color: #333; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    /* Grund-Styling */
    body { font-family: system-ui, sans-serif; margin:20px; background:#f7f7f7; }
    
    /* Header & Navigation */
    .header { display: flex; align-items: center; margin-bottom: 20px; padding-right: 40px; }
    .header-text { flex-grow: 1; display: flex; flex-direction: column; text-align: center; }
    .header-text h1 { font-size: 1.5rem; margin: 0; }
    .header-text h2 { font-size: 1.1rem; color: #555; margin: 0; }
    .header-text h3 { font-size: 1rem; color: #333; font-weight: normal; margin: 0; }

    .dropbtn { background-color:#333; color:white; padding:8px 12px; font-size:16px; border:none; cursor:pointer; border-radius: 4px; }
    .dropdown { position:relative; }
    .dropdown-content { display:none; position:absolute; left:0; top:100%; background-color:white; min-width:160px; box-shadow:0 8px 16px rgba(0,0,0,0.2); z-index: 10; }
    .dropdown-content a { color:black; padding:10px; text-decoration:none; display:block; }
    .dropdown:hover .dropdown-content { display:block; }

    /* Akkordeon / Dropdowns untereinander */
    .accordion-container { max-width: 600px; margin: 20px auto; }
    .accordion-item { border-bottom: 1px solid #ddd; background: white; margin-bottom: 5px; }
    .accordion-item input { display: none; }
    .accordion-header { display: block; padding: 15px; font-weight: bold; cursor: pointer; background: #f1f1f1; position: relative; }
    .accordion-header::after { content: '+'; position: absolute; right: 20px; }
    .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; background: white; }
    .accordion-item input:checked ~ .accordion-content { max-height: 10000px; padding: 10px 0; }
    .accordion-item input:checked ~ .accordion-header::after { content: '−'; }

    /* Karten Styling */
    .card-list { display: flex; flex-direction: column; gap: 10px; padding: 10px; align-items: center; }
    .card-button { 
        width: 100%; 
        max-width: 450px;
        background: white; 
        border: 2px solid #ff0000; 
        border-radius: 10px; 
        padding: 15px; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        cursor: pointer;
        transition: transform 0.1s;
    }
    .card-button:active { transform: scale(0.98); }
    .card-name { font-weight: bold; color: #333; }
    .card-count { font-size: 0.9rem; color: #666; background: #f0f0f0; padding: 4px 8px; border-radius: 5px; }
    .loading-info { font-style: italic; color: #888; padding: 10px; }

    /* Admin Tabellen Styling */
    .admin-table { width: 95%; margin: 10px auto; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    .admin-table th, .admin-table td { padding: 8px; border: 1px solid #ddd; }
    .admin-table th { background-color: #f4f4f4; }
</style>
</head>
<body>

<div class="header">
  <div class="dropdown">
    <button class="dropbtn">☰</button>
    <div class="dropdown-content">
      <a href="FCEPTLogin.html">➜ Log out</a>
      <a href="PTInfos.html">Infos</a>
      <a href="PTSpiele.html">⚽ Unsere Spiele</a>
    </div>
  </div>

  <div class="header-text">
    <h1 id="groupTitle">Pfingstturnier 2026</h1>
    <h2>Hallo, <span id="user-display-name">Gast</span>!</h2>
    <h3 id="welcome-message"></h3>
  </div>
</div>

<div class="accordion-container">

    <div class="accordion-item">
        <input type="checkbox" id="item1">
        <label for="item1" class="accordion-header">Ich bringe</label>
        <div class="accordion-content">
            <div id="my-items-list" class="card-list">
                <span class="loading-info">Lade deine Liste...</span>
            </div>
        </div>
    </div>

    <div class="accordion-item">
    <input type="checkbox" id="item3">
    <label for="item3" class="accordion-header">Meine Dienste</label>
    <div class="accordion-content">
        <div id="my-services-list" class="card-list"> <p>Lade Dienste...</p>
        </div>
    </div>
</div>

    <div class="accordion-item">
        <input type="checkbox" id="item2">
        <label for="item2" class="accordion-header">Offene Bring-Liste</label>
        <div class="accordion-content">
            <div id="open-items-list" class="card-list">
                <span class="loading-info">Lade verfügbare Sachen...</span>
            </div>
        </div>
    </div>

<div class="accordion-item">
    <input type="checkbox" id="item4">
    <label for="item4" class="accordion-header">Offene Dienste</label>
    <div class="accordion-content">
        <div id="open-services-list" class="card-list"> <p>Dienstplan folgt.</p>
        </div>
    </div>
</div>

    <div class="accordion-item">
        <input type="checkbox" id="item6">
        <label for="item6" class="accordion-header">Komplette Liste</label>
        <div class="accordion-content">
             <div id="total-items-list" class="card-list">
                <span class="loading-info">Lade verfügbare Sachen...</span>
            </div>
        </div>
    </div>

    <div class="accordion-item">
        <input type="checkbox" id="item5">
        <label for="item5" class="accordion-header">Team-Statistik</label>
        <div class="accordion-content">
            <div style="padding: 20px;">
                <canvas id="teamChart" width="400" height="300"></canvas>
            </div>
        </div>
    </div>

    <div class="accordion-item" id="admin-assignment-item" style="display: none;">
        <input type="checkbox" id="item7">
        <label for="item7" class="accordion-header" style="background: #e2e8f0;">⚙️ Admin: Wer bringt was?</label>
        <div class="accordion-content">
            <div style="text-align: center; padding: 10px;">
                <button class="admin-btn" style="background-color: #009688; margin-bottom: 15px;" onclick="openUserStatusModal()">Angemeldete User anzeigen</button>
            </div>
            <div id="admin-assignment-list">
                <span class="loading-info">Lade Zuweisungen...</span>
            </div>
        </div>
    </div>
</div>

<div id="admin-area" style="text-align: center; display: none; margin-bottom: 10px;">
    <button class="admin-btn" onclick="document.getElementById('addModal').style.display='block'">+ Neues Item hinzufügen</button>
</div>

<div id="admin-area-dienste" style="text-align: center; display: none; margin-bottom: 20px;">
    <button class="admin-btn" style="background-color: #2196F3;" onclick="document.getElementById('serviceModal').style.display='block'">+ Neuen Dienst hinzufügen</button>
</div>

<div id="userStatusModal" class="modal">
    <div class="modal-content" style="max-width: 600px;">
        <h3>Registrierte Accounts</h3>
        <div style="max-height: 400px; overflow-y: auto;">
            <table class="admin-table">
                <thead>
                    <tr><th>Vorname</th><th>Nachname</th><th>Team</th></tr>
                </thead>
                <tbody id="user-status-table-body">
                    <tr><td colspan="3">Lade Accounts...</td></tr>
                </tbody>
            </table>
        </div>
        <button class="admin-btn" style="background-color: #666;" onclick="document.getElementById('userStatusModal').style.display='none'">Schließen</button>
    </div>
</div>

<div id="serviceModal" class="modal">
    <div class="modal-content">
        <h3>Neuer Dienst</h3>
        <input type="text" id="newServiceName" placeholder="Dienst Name (z.B. Grillen)">
        <select id="newServiceDay">
            <option value="Freitag">Freitag</option>
            <option value="Samstag">Samstag</option>
            <option value="Sonntag">Sonntag</option>
            <option value="Montag">Montag</option>
        </select>
        <button class="admin-btn" style="background-color: #2196F3;" onclick="saveNewService()">Speichern</button>
        <button class="admin-btn" style="background-color: #666;" onclick="document.getElementById('serviceModal').style.display='none'">Abbrechen</button>
    </div>
</div>

<div id="addModal" class="modal">
    <div class="modal-content">
        <h3>Neues Item</h3>
        <input type="text" id="newItemName" placeholder="Name (z.B. Nudelsalat)" style="width: 90%; padding: 8px; margin-bottom: 10px;">
        <input type="number" id="newItemCount" placeholder="Anzahl" style="width: 90%; padding: 8px; margin-bottom: 10px;">
        <button class="admin-btn" style="background-color: #4CAF50;" onclick="saveNewItem()">Speichern</button>
        <button class="admin-btn" style="background-color: #666;" onclick="document.getElementById('addModal').style.display='none'">Abbrechen</button>
    </div>
</div>

<script>
const supabaseUrl = 'https://qkmtybzdthrpjfkbgskw.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrbXR5YnpkdGhycGpma2Jnc2t3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc4ODI3ODIsImV4cCI6MjA4MzQ1ODc4Mn0.VO1Bz0vKO4xTrcu-XCsZlrF4HgvgdbGLz3KKFRfG0Do';
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

const vorname = sessionStorage.getItem('userVorname');
const team = sessionStorage.getItem('gruppeName');
const userId = sessionStorage.getItem('userId');
const userJob = sessionStorage.getItem('userJob'); 

let myChart = null;

async function init() {
    if (!vorname || !userId) { window.location.href = 'index.html'; return; }

    if (userJob === "2") {
        const areaItems = document.getElementById('admin-area');
        const areaDienste = document.getElementById('admin-area-dienste');
        const assignmentItem = document.getElementById('admin-assignment-item');
        
        if (areaItems) areaItems.style.display = 'block';
        if (areaDienste) areaDienste.style.display = 'block';
        if (assignmentItem) assignmentItem.style.display = 'block';
    }

    const nameDisplay = document.getElementById('user-display-name');
    const welcomeDisplay = document.getElementById('welcome-message');
    if (nameDisplay) nameDisplay.innerText = vorname;
    if (welcomeDisplay) welcomeDisplay.innerText = `Team: ${team}`;

    await refreshLists();
}

async function refreshLists() {
    await loadMyItems();
    await loadOpenList();
    await loadTotalList();
    await updateStatistics();
    await loadMyServices();
    await loadOpenServices();
    if (userJob === "2") { await loadAdminAssignments(); }
}

// --- ITEM & DIENST LOGIK HIER UNVERÄNDERT BEIBEHALTEN ---
async function loadMyItems() { const container = document.getElementById('my-items-list'); const { data: myBringData, error: bringError } = await supabaseClient.from('PTBring').select('*').eq('Person', userId); const { data: allItems, error: listError } = await supabaseClient.from('PTListe').select('*'); if (bringError || listError) { container.innerHTML = "Fehler."; return; } if (myBringData.length === 0) { container.innerHTML = "<p>Nichts ausgewählt.</p>"; return; } container.innerHTML = ""; myBringData.forEach(entry => { const itemInfo = allItems.find(i => i.id == entry.Item); const displayName = itemInfo ? itemInfo.Name : "Unbekannt"; container.innerHTML += `<button class="card-button" style="border-color: #28a745;" onclick="removeItem('${entry.id}')"><span class="card-name">${displayName}</span><span class="card-count" style="color: #ff0000; border: 1px solid #ff0000;">Austragen</span></button>`; }); }
async function loadOpenList() { const container = document.getElementById('open-items-list'); const { data: listData } = await supabaseClient.from('PTListe').select('*'); const { data: bringData } = await supabaseClient.from('PTBring').select('Item'); container.innerHTML = ""; listData.forEach(item => { const countTaken = bringData.filter(b => b.Item == item.id).length; const remaining = item.Anzahl - countTaken; if (remaining > 0) { container.innerHTML += `<button class="card-button" onclick="claimItem(${item.id})"><span class="card-name">${item.Name}</span><span class="card-count">Noch ${remaining} benötigt</span></button>`; } }); }
async function claimItem(itemId) { const { error } = await supabaseClient.from('PTBring').insert([{ Item: itemId, Person: userId }]); if (error) alert(error.message); else refreshLists(); }
async function removeItem(recordId) { if (!confirm("Austragen?")) return; await supabaseClient.from('PTBring').delete().eq('id', recordId); refreshLists(); }
async function saveNewItem() { const name = document.getElementById('newItemName').value.trim(); const count = parseInt(document.getElementById('newItemCount').value); if (!name || isNaN(count)) return; await supabaseClient.from('PTListe').insert([{ Name: name, Anzahl: count }]); document.getElementById('addModal').style.display = 'none'; refreshLists(); }
async function saveNewService() { const name = document.getElementById('newServiceName').value.trim(); const tag = document.getElementById('newServiceDay').value; if (!name) return; await supabaseClient.from('PTDienste').insert([{ name: name, tag: tag }]); document.getElementById('serviceModal').style.display = 'none'; refreshLists(); }
async function loadMyServices() { const container = document.getElementById('my-services-list'); if (!container) return; const { data: myDo } = await supabaseClient.from('PTDoDienste').select('*').eq('person', userId); const { data: allS } = await supabaseClient.from('PTDienste').select('*'); if (!myDo || myDo.length === 0) { container.innerHTML = "<p>Keine Dienste übernommen.</p>"; return; } container.innerHTML = ""; myDo.forEach(entry => { const info = allS.find(s => s.id == entry.dienst); const serviceName = info ? info.name : 'Unbekannt'; const serviceTag = info ? info.tag : ''; container.innerHTML += `<button class="card-button" style="border-color: #28a745;" onclick="removeService('${entry.id}')"><span class="card-name">${serviceName} (${serviceTag})</span><span class="card-count" style="color: #28a745; border: 1px solid #28a745;">Austragen</span></button>`; }); }
async function loadOpenServices() { const container = document.getElementById('open-services-list'); if (!container) return; const { data: allS } = await supabaseClient.from('PTDienste').select('*'); const { data: takenS } = await supabaseClient.from('PTDoDienste').select('dienst'); if (!allS || allS.length === 0) { container.innerHTML = "<p>Aktuell keine offenen Dienste.</p>"; return; } container.innerHTML = ""; allS.forEach(s => { if (!takenS || !takenS.some(t => t.dienst == s.id)) { container.innerHTML += `<button class="card-button" onclick="claimService(${s.id})"><span class="card-name">${s.name} (${s.tag})</span><span class="card-count">Übernehmen</span></button>`; } }); }
async function claimService(sId) { await supabaseClient.from('PTDoDienste').insert([{ dienst: sId, person: userId }]); refreshLists(); }
async function removeService(rId) { await supabaseClient.from('PTDoDienste').delete().eq('id', rId); refreshLists(); }
async function loadAdminAssignments() { const container = document.getElementById('admin-assignment-list'); if (!container) return; const { data: items } = await supabaseClient.from('PTListe').select('*').order('Name'); const { data: brings } = await supabaseClient.from('PTBring').select('*'); const { data: users } = await supabaseClient.from('Pfingstturnier').select('id, vorname, nachname'); if (!items || !brings || !users) { container.innerHTML = "<p style='padding:10px;'>Fehler beim Laden der Admin-Daten.</p>"; return; } let html = `<table class="admin-table"><thead><tr><th>Gegenstand</th><th>Person (Vor- & Nachname)</th></tr></thead><tbody>`; items.forEach(item => { const itemBrings = brings.filter(b => b.Item == item.id); for (let i = 0; i < item.Anzahl; i++) { let personName = "<span style='color:#aaa;'><i>Noch offen</i></span>"; if (itemBrings[i]) { const userObj = users.find(u => u.id == itemBrings[i].Person); if (userObj) { personName = `<b>${userObj.vorname} ${userObj.nachname || ''}</b>`; } else { personName = "Unbekannter User"; } } html += `<tr><td>${item.Name} (Slot ${i+1}/${item.Anzahl})</td><td>${personName}</td></tr>`; } }); html += `</tbody></table>`; container.innerHTML = html; }
async function openUserStatusModal() { document.getElementById('userStatusModal').style.display = 'block'; const tbody = document.getElementById('user-status-table-body'); tbody.innerHTML = '<tr><td colspan="3">Lade Daten...</td></tr>'; const { data: users, error } = await supabaseClient.from('Pfingstturnier').select('vorname, nachname, team').order('team', { ascending: true }); if (error || !users) { tbody.innerHTML = '<tr><td colspan="3" style="color:red;">Fehler beim Laden.</td></tr>'; return; } if (users.length === 0) { tbody.innerHTML = '<tr><td colspan="3">Noch keine User registriert.</td></tr>'; return; } tbody.innerHTML = ''; users.forEach(u => { tbody.innerHTML += `<tr><td>${u.vorname || ''}</td><td>${u.nachname || '-'}</td><td><span class="card-count">${u.team || 'Keins'}</span></td></tr>`; }); }
async function loadTotalList() { const container = document.getElementById('total-items-list'); const { data: listData } = await supabaseClient.from('PTListe').select('*'); const { data: bringData } = await supabaseClient.from('PTBring').select('Item'); container.innerHTML = ""; listData.forEach(item => { const count = bringData.filter(b => b.Item == item.id).length; const isComplete = count >= item.Anzahl; const color = isComplete ? "#28a745" : "#ff0000"; if (isComplete) { container.innerHTML += `<div class="card-button" style="border-color: ${color}; opacity: 0.7;"><span class="card-name">${item.Name}</span><span class="card-count">VOLL</span></div>`; } else { container.innerHTML += `<button class="card-button" style="border-color: ${color};" onclick="claimItem(${item.id})"><span class="card-name">${item.Name}</span><span class="card-count">${count}/${item.Anzahl}</span></button>`; } }); }
async function updateStatistics() { const { data: bData } = await supabaseClient.from('PTBring').select('Person'); const { data: uData } = await supabaseClient.from('Pfingstturnier').select('id, team'); if (!bData || !uData) return; const stats = { "C": 0, "E(Wagner)": 0, "E(Hauni)": 0, "D": 0 }; bData.forEach(b => { const u = uData.find(user => user.id == b.Person); if (u && stats[u.team] !== undefined) stats[u.team]++; }); const ctx = document.getElementById('teamChart').getContext('2d'); if (myChart) myChart.destroy(); myChart = new Chart(ctx, { type: 'bar', data: { labels: Object.keys(stats), datasets: [{ label: 'Items', data: Object.values(stats), backgroundColor: '#4CAF50' }] }, options: { scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } } }); }

init();
</script>
</body>
</html>
